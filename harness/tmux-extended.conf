# The extended-keys profile: everything in tmux.conf, plus modified keys
# forwarded as CSI u. Reproduces lesson 61 (tmux 3.3a needs `extended-keys
# always` for a modified Enter; then Ctrl+M submits even on stock Codex).
source-file -F "#{d:current_file}/tmux.conf"
set -g extended-keys always
set -as terminal-features "screen*:extkeys"
