# Host versions the harness installs and runs (docs/plan/20, "Version matrix").
# `versions` are pinned; "latest" is resolved from the npm registry at install
# time and recorded in each run's evidence. The drift check compares the
# newest release's probe results with the newest pinned version's.
#
# Installs go to <main checkout>/experiments/.cache/hosts/<host>/<version>/<platform>/,
# shared by every worktree, with npm's install scripts off (no third-party
# code runs at install time); the harness finds each platform binary itself.

[hosts.pi]
package = "@earendil-works/pi-coding-agent"
# 1.3.0: round 14's latest; 1.2.0: the release before it (lesson 59).
versions = ["1.3.0", "1.2.0"]
latest = true

[hosts.opencode]
package = "@opencode/cli"
# 2.1.1: round 14; 2.1.0: round 10 (OpenTUI 0.6.6); 2.0.32: round 8 (OpenTUI 0.5.17).
versions = ["2.1.1", "2.1.0", "2.0.32"]
# Still installed and probed (the degraded path must say so), but not supported:
# OpenTUI 0.5.17 has no measureText, so Murmo cannot edit the prompt there and
# shortcuts and autocorrect stay off.
unsupported = ["2.0.32"]
latest = true

[hosts.claude]
package = "@anthropic-ai/claude-code"
# 2.1.304: round 14; 2.1.302 and 2.1.303 were also probed (lesson 59).
versions = ["2.1.304", "2.1.303", "2.1.302"]
latest = true

[hosts.codex]
package = "@openai/codex"
# 0.163.0: round 14; 0.162.1: the 0.162.x line probed before it.
versions = ["0.163.0", "0.162.1"]
latest = true

# Pure-Python screen emulator for the direct-PTY driver, installed into a
# venv in the same cache (pip, or a local copy checked against its RECORD).
[python]
pyte = "0.8.2"
wcwidth = "0.9.2"

[platforms]
# Linux binaries are installed on any machine with npm's --os/--cpu/--libc
# flags and mounted read-only into the no-network container.
linux = ["linux-arm64", "linux-x64"]
