# The harness's tmux config (harness/README.md). The harness starts a private
# server with `tmux -S <run socket> -f harness/tmux.conf`; the user's own tmux
# config and server are never used (safety rule 10).

# No key of ours sits between the driver and the host: a global Tab binding
# once took Tab before Murmo (lesson 78).
set -g prefix None
set -g prefix2 None
unbind-key -a -T prefix
unbind-key -a -T root
unbind-key -a -T copy-mode
unbind-key -a -T copy-mode-vi

# Extended keys off: under tmux with extended keys, Ctrl+M submits even on
# stock Codex (lessons 61, 68). tmux-extended.conf turns them on to reproduce that.
set -g extended-keys off

# Escape reaches the host at once; the driver adds its own gap after Escape.
set -s escape-time 0

set -g status off
set -g default-terminal "screen-256color"
set -g history-limit 5000
set -g remain-on-exit on
set -g window-size manual
set -g allow-rename off
set -g set-titles off
