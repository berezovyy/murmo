version = 1
# The project file the host cases in fixtures/hosts/project-shortcuts.json load.
[replace]
";hp" = 'harness project shortcut'
";привіт" = 'harness greeting'

[replace.";hr"]
text = 'Review <change> for correctness.'
description = "Harness review template"
fields.change = { default = "this change" }

# fixtures/hosts/template-fields.json: Tab between fields, a default in the second.
[replace.";hf"]
text = 'Review <change> for <concern>.'
fields.concern = { default = "races" }
