[workspace]
resolver = "2"
members = ["packages/js-runtime"]

[workspace.package]
edition = "2021"
rust-version = "1.99.0"
publish = false

# Exact pins: the versions the round 12-14 prototypes ran on real hosts.
[workspace.dependencies]
rquickjs = "=0.12.2"
serde_json = "=1.0.154"
libc = "=0.2.190"
vt100 = "=0.16.2"
unicode-segmentation = "=1.13.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The QuickJS C engine runs every guest bundle in tests (the rquickjs
# conformance launcher, parity checks); unoptimized it is several times slower.
[profile.dev.package.rquickjs-sys]
opt-level = 3
